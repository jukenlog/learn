    <style>
        :root { color-scheme: light; --ink:#172c41; --muted:#60758a; --accent:#087f83; --line:#dce5ea; }
        * { box-sizing:border-box; }
        body { margin:0; height:100vh; height:100dvh; display:flex; overflow:hidden; background:#f3f6f8; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif; -webkit-font-smoothing:antialiased; }
        button,select { font:inherit; }
        .sidebar { width:310px; flex-shrink:0; display:flex; flex-direction:column; background:#132b40; color:#eaf2f7; }
        .sidebar-header { padding:32px 26px 25px; border-bottom:1px solid #ffffff15; }
        .brand-label { color:#77d6cf; letter-spacing:.18em; font-size:10px; font-weight:700; margin-bottom:18px; }
        .sidebar-header h1 { margin:0; font-size:13px; font-weight:500; color:#bdcedd; }
        .course-name { display:block; margin-top:9px; font-size:25px; font-weight:750; letter-spacing:.06em; color:#fff; }
        .sidebar-header p { margin:13px 0 0; font-size:11px; color:#a8becf; }
        .sidebar-menu { flex:1; min-height:0; overflow-y:auto; padding:15px 12px 22px; scrollbar-width:thin; scrollbar-color:#4b6478 transparent; }
        .sidebar-item { width:100%; display:flex; align-items:center; gap:12px; padding:13px 12px; margin:3px 0; border:1px solid transparent; border-radius:10px; background:transparent; color:#c4d3df; text-align:left; cursor:pointer; font-size:12px; line-height:1.6; transition:background .15s,color .15s; }
        .chapter-number { display:grid; place-items:center; flex-shrink:0; width:29px; height:29px; border:1px solid #ffffff20; border-radius:8px; font-size:11px; font-variant-numeric:tabular-nums; color:#97b4c8; }
        .sidebar-item:hover { background:#ffffff09; color:white; }
        .sidebar-item.active { color:white; background:#205165; border-color:#70d6d52a; }
        .sidebar-item.active .chapter-number { background:#8ce0d7; color:#173d47; border-color:transparent; font-weight:750; }
        .mobile-nav { display:none; }
        .main-content { flex:1; min-width:0; overflow-y:auto; padding:48px clamp(24px,5vw,76px); background:radial-gradient(ellipse at top right,#e5f1f0 0,transparent 55%); }
        .chapter-container { max-width:1000px; margin:0 auto 60px; }
        .chapter-heading { padding-bottom:26px; margin-bottom:28px; border-bottom:1px solid var(--line); }
        .eyebrow { font-size:11px; font-weight:700; letter-spacing:.14em; color:var(--accent); margin:0 0 14px; }
        h2 { font-size:clamp(22px,2.5vw,32px); line-height:1.5; letter-spacing:.01em; margin:0 0 12px; }
        .chapter-description { font-size:12px; color:var(--muted); margin:0; line-height:1.8; }
        .section-card { background:#ffffffde; border:1px solid #e1e9ee; border-radius:18px; padding:24px; margin-bottom:20px; box-shadow:0 5px 22px #183c5104; }
        .section-title { display:flex; align-items:center; gap:10px; font-size:15px; font-weight:700; margin:0 0 19px; }
        .section-title::before { content:""; width:4px; height:16px; border-radius:3px; background:var(--accent); }
        .list-container { display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:10px; }
        .link-btn { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:52px; padding:14px; border:1px solid #dce6eb; border-radius:10px; background:#f8fafb; color:var(--ink); text-decoration:none; font-size:13px; font-weight:600; transition:background .15s,border-color .15s,transform .15s; }
        .play-icon { width:22px; height:22px; flex-shrink:0; display:grid; place-items:center; border-radius:50%; color:var(--accent); background:#e2f0ef; font-size:8px; padding-left:1px; }
        .link-btn:hover { background:#eaf6f4; border-color:#7fbeb7; transform:translateY(-2px); }
        .link-btn:active { transform:translateY(0); }
        :is(.sidebar-item,.link-btn,select):focus-visible { outline:3px solid #29b9b0; outline-offset:3px; }
        .membership-notice { margin-top:16px; border:1px solid #ffffff25; border-radius:9px; background:#ffffff08; font-size:12px; line-height:1.8; }
        .membership-notice summary { min-height:44px; padding:11px 12px; cursor:pointer; color:#c8ece8; font-size:11px; font-weight:600; }
        .membership-notice-body { padding:0 12px 13px; }
        .sidebar-header .membership-notice p { display:block; margin:0 0 8px; color:#d4e2ec; font-size:11px; }
        .sidebar-header .membership-notice p:last-child { margin-bottom:0; }
        .membership-notice a { color:#91e4dc; text-underline-offset:3px; overflow-wrap:anywhere; }
        .membership-notice :is(a,summary):focus-visible { outline:3px solid #29b9b0; outline-offset:3px; }
        .page-footer { color:var(--muted); font-size:11px; text-align:center; padding:12px 0; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(5px); } to { opacity:1; transform:translateY(0); } }
        .animate-in { animation:fadeIn .2s ease-out; }
        @media(max-width:1100px) { .sidebar { width:275px; } .main-content { padding:32px 24px; } .list-container { grid-template-columns:repeat(3,minmax(0,1fr)); } }
        @media(max-width:700px) {
            body { flex-direction:column; }
            .sidebar { width:100%; }
            .sidebar-header { padding:18px 20px 12px; border:0; }
            .brand-label { display:none; }
            .sidebar-header h1 { font-size:11px; }
            .course-name { font-size:21px; margin-top:3px; }
            .sidebar-header > p { display:none; }
            .sidebar-menu { display:none; }
            .mobile-nav { display:block; padding:0 20px 17px; }
            .mobile-nav label { display:block; font-size:10px; color:#b2c6d6; margin-bottom:6px; }
            .mobile-nav select { width:100%; min-height:44px; border:1px solid #60788b; border-radius:8px; padding:10px; color:white; background:#203e55; font-size:13px; }
            .main-content { padding:24px 16px; min-height:0; }
            .chapter-heading { padding-bottom:20px; margin-bottom:20px; }
            .eyebrow { font-size:10px; margin-bottom:8px; }
            h2 { font-size:23px; }
            .section-card { border-radius:14px; padding:18px 16px; margin-bottom:16px; }
            .list-container { gap:8px; }
            .link-btn { padding:12px 10px; font-size:12px; }
        }
        @media(max-width:390px) { .list-container { grid-template-columns:repeat(2,minmax(0,1fr)); } }
        @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; } }
    
        .course-nav { display:flex; gap:6px; margin-top:16px; margin-bottom:0; }
        .course-nav a { flex:1; display:flex; align-items:center; justify-content:center; min-height:44px; padding:9px 5px; border:1px solid #ffffff35; border-radius:8px; color:#d9e8f2; text-decoration:none; font-size:12px; font-weight:600; white-space:nowrap; }
        .course-nav a:hover { background:#ffffff15; }
        .course-nav a[aria-current="page"] { background:#91e4dc; color:#173d47; border-color:#91e4dc; }
        .course-nav a:focus-visible { outline:3px solid #29b9b0; outline-offset:2px; }
        @media(max-width:700px) { .course-nav { margin-top:14px; margin-bottom:0; } }
        .video-modal { width:min(1000px, calc(100vw - 24px)); max-width:none; max-height:calc(100dvh - 24px); padding:0; border:1px solid #355166; border-radius:16px; background:#102637; color:#fff; box-shadow:0 24px 90px #0008; }
        .video-modal::backdrop { background:#06121ddd; }
        .video-modal-header { display:flex; align-items:center; justify-content:space-between; gap:16px; padding:12px 16px; }
        .video-modal-title { margin:0; font-size:14px; line-height:1.5; }
        .video-modal-close { flex-shrink:0; min-height:44px; padding:8px 14px; border:1px solid #ffffff40; border-radius:8px; color:#fff; background:#ffffff10; cursor:pointer; font:inherit; }
        .video-modal-close:focus-visible { outline:3px solid #91e4dc; outline-offset:2px; }
        .video-frame { display:block; width:100%; height:min(56.25vw, calc(100dvh - 110px)); max-height:563px; min-height:140px; border:0; background:#000; }
        html.video-open, html.video-open body { overflow:hidden; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            
            <div class="brand-label">MATH VIDEO LIBRARY</div>
            <h1>中学受験新演習<span class="course-name">算数 ５年上</span></h1>
            <p>第11〜20回 · 解説動画ライブラリ</p>
            <details id="membershipNotice" class="membership-notice" open>
                <summary>閲覧に関する注意事項</summary>
                <div class="membership-notice-body">
                    <p>解説動画の閲覧には、以下のnoteメンバーシップへの登録が必要です。</p>
                    <p><a href="https://note.com/hiradoinoshojuku/membership" target="_blank" rel="noopener noreferrer">https://note.com/hiradoinoshojuku/membership</a></p>
                </div>
            </details>
            <nav class="course-nav" aria-label="教材を選ぶ"><a href="math5-1.html" aria-current="page">小５上</a><a href="math5-2.html">小５下</a><a href="math6-1.html">小６上</a></nav>
        </div>
        <div class="mobile-nav"><label for="chapterSelect">単元を選ぶ</label><select id="chapterSelect"></select></div>
        <nav id="sidebarMenu" class="sidebar-menu" aria-label="単元一覧"></nav>
    </div>

    <div class="main-content">
        <div id="contentArea" class="chapter-container">
            </div>
    </div>

    <dialog id="videoModal" class="video-modal" aria-labelledby="videoModalTitle">
        <div class="video-modal-header">
            <h2 id="videoModalTitle" class="video-modal-title">解説動画</h2>
            <button type="button" id="videoModalClose" class="video-modal-close" autofocus>閉じる ×</button>
        </div>
        <iframe id="videoFrame" class="video-frame" title="解説動画" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </dialog>

    <script>
        // 2. 初期表示とイベント設定
        const sidebarMenu = document.getElementById('sidebarMenu');
        const contentArea = document.getElementById('contentArea');
        const chapterSelect = document.getElementById('chapterSelect');
        const lastChapterKey = 'math-5-upper:last-chapter';
        const membershipNotice = document.getElementById('membershipNotice');
        const noticeSeenKey = 'math-5-upper:membership-notice-seen';
        try {
            membershipNotice.open = localStorage.getItem(noticeSeenKey) !== '1';
            localStorage.setItem(noticeSeenKey, '1');
        } catch {
            // 保存機能が使えない場合も、注意事項は手動で開閉できます。
        }

        function init() {

            let defaultChapter = chapterData.find(chapter => chapter.active) || chapterData[0];
            try {
                const savedId = localStorage.getItem(lastChapterKey);
                defaultChapter = chapterData.find(chapter => chapter.id === savedId) || defaultChapter;
            } catch {
                // 保存機能が利用できない場合は、従来の初期単元を表示します。
            }

            chapterData.forEach((chapter) => {
                // サイドバー項目の生成
                const item = document.createElement('button');
                item.type = 'button';
        
                // 判定：現在のループのチャプターがデフォルトチャプターと同じなら active クラスを付与
                const isActive = (chapter.id === defaultChapter.id);
                item.className = `sidebar-item ${isActive ? 'active' : ''}`;
        
                const chapterNumber = chapter.id.replace('ch', '');
                const number = document.createElement('span');
                number.className = 'chapter-number';
                number.textContent = chapterNumber.padStart(2, '0');
                const title = document.createElement('span');
                title.textContent = chapter.title.replace(/^第\d+回\s*/, '');
                item.append(number, title);
                item.dataset.chapterId = chapter.id;
                const option = document.createElement('option');
                option.value = chapter.id;
                option.textContent = chapter.title;
                chapterSelect.appendChild(option);
                item.onclick = () => renderChapter(chapter, item);
                sidebarMenu.appendChild(item);

                // デフォルトチャプターの内容を描画
                if (isActive) {
                    renderChapter(chapter, item);
                }
            });
            chapterSelect.value = defaultChapter.id;
            chapterSelect.onchange = () => {
                const chapter = chapterData.find(chapter => chapter.id === chapterSelect.value);
                const item = [...sidebarMenu.children].find(item => item.dataset.chapterId === chapter.id);
                renderChapter(chapter, item);
            };
            sidebarMenu.querySelector('.active')?.scrollIntoView({ block: 'nearest' });
        }

        // 3. コンテンツの描画関数
        function renderChapter(chapter, element) {
            chapterSelect.value = chapter.id;
            try {
                localStorage.setItem(lastChapterKey, chapter.id);
            } catch {
                // 保存できない場合も、単元の切り替えを続行します。
            }
            // サイドバーの active 切り替え
            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
            document.querySelectorAll('.sidebar-item').forEach(item => item.setAttribute('aria-current', item === element ? 'true' : 'false'));
            document.querySelector('.main-content').scrollTop = 0;

            // HTMLの組み立て
            let html = `<div class="animate-in"><header class="chapter-heading"><p class="eyebrow">CHAPTER ${chapter.id.replace('ch', '').padStart(2, '0')}</p><h2>${chapter.title}</h2><p class="chapter-description">見たい問題を選んで、解説動画を再生しましょう。</p></header>`;
            
            chapter.sections.forEach(section => {
                html += `<section class="section-card"><h3 class="section-title">${section.name}</h3>`;
                html += `<div class="list-container">`;
                section.links.forEach(link => {
                    html += `<a href="${link.url}" class="link-btn" aria-haspopup="dialog"><span>${link.t}</span><span class="play-icon" aria-hidden="true">▶</span></a>`;
                });
                html += `</div></section>`;
            });

            html += `<footer class="page-footer">中学受験新演習 · 算数５年上</footer></div>`;
            contentArea.innerHTML = html;
        }

        const videoModal = document.getElementById('videoModal');
        const videoFrame = document.getElementById('videoFrame');
        const videoModalTitle = document.getElementById('videoModalTitle');
        let videoTrigger = null;
        contentArea.addEventListener('click', event => {
            const link = event.target.closest('a.link-btn');
            if (!link || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
            const url = new URL(link.href);
            if (url.hostname !== 'player.vimeo.com') return;
            event.preventDefault();
            videoTrigger = link;
            const section = link.closest('.section-card').querySelector('.section-title').textContent;
            const problem = link.querySelector('span').textContent;
            videoModalTitle.textContent = `${section} · ${problem}`;
            videoFrame.title = `${section} ${problem}の解説動画`;
            url.searchParams.set('autoplay', '1');
            url.searchParams.set('muted', '0');
            url.searchParams.set('playsinline', '1');
            videoFrame.src = url.href;
            videoModal.showModal();
            document.documentElement.classList.add('video-open');
        });
        document.getElementById('videoModalClose').addEventListener('click', () => videoModal.close());
        videoModal.addEventListener('click', event => {
            const rect = videoModal.getBoundingClientRect();
            if (event.target === videoModal && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom)) videoModal.close();
        });
        videoModal.addEventListener('close', () => {
            videoFrame.removeAttribute('src');
            document.documentElement.classList.remove('video-open');
            videoTrigger?.focus();
        });

        init();
    </script>
</body>
</html>
