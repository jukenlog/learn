    <script>
        // 2. 初期表示とイベント設定
        const sidebarMenu = document.getElementById('sidebarMenu');
        const contentArea = document.getElementById('contentArea');
        const chapterSelect = document.getElementById('chapterSelect');
        const lastChapterKey = 'math-5-lower:last-chapter';
        const membershipNotice = document.getElementById('membershipNotice');
        const noticeSeenKey = 'math-5-lower:membership-notice-seen';
        try {
            membershipNotice.open = localStorage.getItem(noticeSeenKey) !== '1';
            localStorage.setItem(noticeSeenKey, '1');
        } catch {
            // 保存機能が使えない場合も、注意事項は手動で開閉できます。
        }

        function init() {

            let defaultChapter = chapterData[active-1] || chapterData[0];
            try {
                const savedId = localStorage.getItem(lastChapterKey);
                defaultChapter = chapterData.find(chapter => chapter.id === savedId) || defaultChapter;
            } catch {
                // 保存機能が利用できない場合は、従来の初期単元を表示します。
            }

            chapterData.forEach((chapter) => {
                // サイドバー項目の生成
                const item = document.createElement('button');
                item.type = 'button';
        
                // 判定：現在のループのチャプターがデフォルトチャプターと同じなら active クラスを付与
                const isActive = (chapter.id === defaultChapter.id);
                item.className = `sidebar-item ${isActive ? 'active' : ''}`;
        
                const chapterNumber = chapter.id.replace('ch', '');
                const number = document.createElement('span');
                number.className = 'chapter-number';
                number.textContent = chapterNumber.padStart(2, '0');
                const title = document.createElement('span');
                title.textContent = chapter.title.replace(/^第\d+回\s*/, '');
                item.append(number, title);
                item.dataset.chapterId = chapter.id;
                const option = document.createElement('option');
                option.value = chapter.id;
                option.textContent = chapter.title;
                chapterSelect.appendChild(option);
                item.onclick = () => renderChapter(chapter, item);
                sidebarMenu.appendChild(item);

                // デフォルトチャプターの内容を描画
                if (isActive) {
                    renderChapter(chapter, item);
                }
            });
            chapterSelect.value = defaultChapter.id;
            chapterSelect.onchange = () => {
                const chapter = chapterData.find(chapter => chapter.id === chapterSelect.value);
                const item = [...sidebarMenu.children].find(item => item.dataset.chapterId === chapter.id);
                renderChapter(chapter, item);
            };
            sidebarMenu.querySelector('.active')?.scrollIntoView({ block: 'nearest' });
        }

        // 3. コンテンツの描画関数
        function renderChapter(chapter, element) {
            chapterSelect.value = chapter.id;
            try {
                localStorage.setItem(lastChapterKey, chapter.id);
            } catch {
                // 保存できない場合も、単元の切り替えを続行します。
            }
            // サイドバーの active 切り替え
            document.querySelectorAll('.sidebar-item').forEach(i => i.classList.remove('active'));
            element.classList.add('active');
            document.querySelectorAll('.sidebar-item').forEach(item => item.setAttribute('aria-current', item === element ? 'true' : 'false'));
            document.querySelector('.main-content').scrollTop = 0;

            // HTMLの組み立て
            let html = `<div class="animate-in"><header class="chapter-heading"><p class="eyebrow">CHAPTER ${chapter.id.replace('ch', '').padStart(2, '0')} / 18</p><h2>${chapter.title}</h2><p class="chapter-description">見たい問題を選んで、解説動画を再生しましょう。</p></header>`;
            
            chapter.sections.forEach(section => {
                html += `<section class="section-card"><h3 class="section-title">${section.name}</h3>`;
                html += `<div class="list-container">`;
                section.links.forEach(link => {
                    html += `<a href="${link.url}" class="link-btn" aria-haspopup="dialog"><span>${link.t}</span><span class="play-icon" aria-hidden="true">▶</span></a>`;
                });
                html += `</div></section>`;
            });

            html += `<footer class="page-footer">中学受験新演習 · 算数５年下</footer></div>`;
            contentArea.innerHTML = html;
        }

        const videoModal = document.getElementById('videoModal');
        const videoFrame = document.getElementById('videoFrame');
        const videoModalTitle = document.getElementById('videoModalTitle');
        let videoTrigger = null;
        contentArea.addEventListener('click', event => {
            const link = event.target.closest('a.link-btn');
            if (!link || event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
            const url = new URL(link.href);
            if (url.hostname !== 'player.vimeo.com') return;
            event.preventDefault();
            videoTrigger = link;
            const section = link.closest('.section-card').querySelector('.section-title').textContent;
            const problem = link.querySelector('span').textContent;
            videoModalTitle.textContent = `${section} · ${problem}`;
            videoFrame.title = `${section} ${problem}の解説動画`;
            url.searchParams.set('autoplay', '1');
            url.searchParams.set('muted', '0');
            url.searchParams.set('playsinline', '1');
            videoFrame.src = url.href;
            videoModal.showModal();
            document.documentElement.classList.add('video-open');
        });
        document.getElementById('videoModalClose').addEventListener('click', () => videoModal.close());
        videoModal.addEventListener('click', event => {
            const rect = videoModal.getBoundingClientRect();
            if (event.target === videoModal && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom)) videoModal.close();
        });
        videoModal.addEventListener('close', () => {
            videoFrame.removeAttribute('src');
            document.documentElement.classList.remove('video-open');
            videoTrigger?.focus();
        });

        init();
    </script>
</body>
</html>
